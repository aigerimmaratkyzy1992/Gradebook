# Netlify — frontend (Vite + React).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Backend адресі (Render). netlify.toml мәні Netlify UI-дағы айнымалыдан басым.
  VITE_API_URL = "https://gradebook-api-jpv7.onrender.com"

# SPA: react-router жолдары серверде жоқ, бәрі index.html-ге бағытталады.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
